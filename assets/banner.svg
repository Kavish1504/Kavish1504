<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="55%" stop-color="#140829"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#B026FF"/>
    </linearGradient>
    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="typewriter">
      <rect x="256" y="192" height="30" width="0">
        <animate attributeName="width" from="0" to="640" dur="2.2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <g stroke-width="1" opacity="0.55">
    <path id="p1" d="M60,60 L180,120 L140,230 L60,270" fill="none" stroke="#8b5cf6"/>
    <line x1="180" y1="120" x2="300" y2="90" stroke="#00F5FF"/>
    <path id="p2" d="M1000,55 L1120,100 L1080,220 L1150,270" fill="none" stroke="#8b5cf6"/>
    <line x1="1000" y1="55" x2="950" y2="150" stroke="#00F5FF"/>
  </g>

  <g>
    <circle cx="60" cy="60" r="4" fill="#00F5FF"/>
    <circle cx="180" cy="120" r="5" fill="#B026FF"/>
    <circle cx="140" cy="230" r="3" fill="#00F5FF"/>
    <circle cx="60" cy="270" r="4" fill="#8b5cf6"/>
    <circle cx="300" cy="90" r="3" fill="#00F5FF"/>
    <circle cx="1000" cy="55" r="4" fill="#B026FF"/>
    <circle cx="1120" cy="100" r="5" fill="#00F5FF"/>
    <circle cx="1080" cy="220" r="3" fill="#8b5cf6"/>
    <circle cx="1150" cy="270" r="4" fill="#00F5FF"/>
    <circle cx="950" cy="150" r="3" fill="#B026FF"/>
  </g>

  <circle cx="180" cy="120" r="10" fill="url(#node-glow)">
    <animate attributeName="r" values="10;30;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="100" r="10" fill="url(#node-glow)">
    <animate attributeName="r" values="10;30;10" dur="3s" begin="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="270" r="8" fill="url(#node-glow)">
    <animate attributeName="r" values="8;22;8" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
  </circle>

  <circle r="4" fill="#00F5FF">
    <animateMotion dur="4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p1"/>
    </animateMotion>
  </circle>
  <circle r="4" fill="#B026FF">
    <animateMotion dur="4.5s" begin="1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#p2"/>
    </animateMotion>
  </circle>

  <rect x="230" y="55" width="740" height="210" rx="12" fill="#0d0d1f" stroke="#2a2a4a" stroke-width="1.5"/>
  <rect x="230" y="55" width="740" height="34" rx="12" fill="#161629"/>
  <circle cx="254" cy="72" r="6" fill="#ff5f57"/>
  <circle cx="274" cy="72" r="6" fill="#febc2e"/>
  <circle cx="294" cy="72" r="6" fill="#28c840"/>
  <text x="600" y="77" font-family="JetBrains Mono, monospace" font-size="13" fill="#6b6b8f" text-anchor="middle">kavish@rag-engine: ~</text>

  <text x="256" y="118" font-family="JetBrains Mono, monospace" font-size="17" fill="#00F5FF" opacity="0">
    $ query --who-is kavish
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.1s" fill="freeze"/>
  </text>
  <text x="256" y="150" font-family="JetBrains Mono, monospace" font-size="17" fill="#e5e5f0" opacity="0">
    &gt; retrieving top-k=1 profile match...
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.4s" fill="freeze"/>
  </text>

  <g clip-path="url(#typewriter)">
    <text x="256" y="212" font-family="JetBrains Mono, monospace" font-size="20" font-weight="700" fill="url(#glow)">Kavish Gupta — Data Scientist / LLM Engineer</text>
  </g>

  <text x="256" y="245" font-family="JetBrains Mono, monospace" font-size="15" fill="#9d9dc4" opacity="0">
    RAG Systems · Vector Search · Applied ML
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3.1s" fill="freeze"/>
  </text>

  <rect x="256" y="228" width="10" height="18" fill="#00F5FF">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.9s" begin="2.9s" repeatCount="indefinite"/>
  </rect>
</svg>
